# Perform a Gradle `build` which includes `assemble`, `check`, `test` of the projects.

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Check the integrity of the Gradle Wrapper executables and lint workflows
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # ratchet:gradle/actions/wrapper-validation@v6.1.0
      - name: Lint GitHub Actions
        uses: abcxyz/actions/.github/actions/lint-github-actions@e32ec3bd6af6d87d79fe7c441f435eb7ad11d527 # ratchet:abcxyz/actions/.github/actions/lint-github-actions@main
      - name: Ratchet Check
        uses: sethvargo/ratchet@8b4ca256dbed184350608a3023620f267f0a5253 # ratchet:sethvargo/ratchet@main
        with:
          files: .github/workflows/*.yml

  # Detect which plugin directories a PR touches so we can skip unrelated jobs.
  # On push-to-main and workflow_dispatch, downstream jobs ignore these outputs and always run.
  changes:
    needs: lint-and-check
    runs-on: ubuntu-latest
    outputs:
      strict-version-matcher: ${{ steps.filter.outputs.strict-version-matcher }}
      google-services: ${{ steps.filter.outputs.google-services }}
      oss-licenses: ${{ steps.filter.outputs.oss-licenses }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # ratchet:dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            strict-version-matcher:
              - 'strict-version-matcher-plugin/**'
              - '.github/workflows/main.yml'
            google-services:
              - 'google-services-plugin/**'
              - '.github/workflows/main.yml'
            oss-licenses:
              - 'oss-licenses-plugin/**'
              - '.github/workflows/main.yml'

  build-strict-version-matcher:
    needs: [lint-and-check, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.strict-version-matcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # ratchet:gradle/actions/setup-gradle@v6.1.0
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./strict-version-matcher-plugin

  build-google-services:
    needs: [lint-and-check, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.google-services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # ratchet:gradle/actions/setup-gradle@v6.1.0
        with:
          dependency-graph: generate-and-submit

      - name: Perform a Gradle build
        run: ./gradlew build
        working-directory: ./google-services-plugin

  # Build and test the oss-licenses plugin, then publish for downstream jobs.
  oss-licenses-build:
    needs: [lint-and-check, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.oss-licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # ratchet:gradle/actions/setup-gradle@v6.1.0
        with:
          dependency-graph: generate-and-submit

      - name: Build and run unit tests
        # We run unit tests here but exclude the IntegrationTest matrix and E2E tests
        # which are run in parallel downstream.
        run: ./gradlew build -x e2eTestTask -PexcludeIntegrationTests
        working-directory: ./oss-licenses-plugin

      - name: Publish to local repo
        run: ./gradlew publish
        working-directory: ./oss-licenses-plugin

      - name: Upload local repo artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: oss-licenses-local-repo
          path: oss-licenses-plugin/build/repo/

  # Run the version-matricked integration tests in parallel.
  oss-licenses-integration-test:
    needs: oss-licenses-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agp-version-key: [AGP74, AGP87, AGP812, AGP_STABLE, AGP_ALPHA]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download local repo artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: oss-licenses-local-repo
          path: oss-licenses-plugin/build/repo/

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # ratchet:gradle/actions/setup-gradle@v6.1.0

      - name: Run Integration Test (${{ matrix.agp-version-key }})
        run: ./gradlew test --tests "com.google.android.gms.oss.licenses.plugin.IntegrationTest_${{ matrix.agp-version-key }}"
        working-directory: ./oss-licenses-plugin

  # Run end-to-end tests: build the full testapp against the AGP/Gradle version matrix.
  # Uses the locally-published plugin from oss-licenses-build via -PusePublishedPluginFrom.
  # CC strictness flags are in testapp/gradle.properties (always on).
  oss-licenses-e2e:
    needs: oss-licenses-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agp-version-key: [AGP812, AGP_STABLE, AGP_ALPHA]
    env:
      ANDROID_USER_HOME: /home/runner/.android
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download local repo artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: oss-licenses-local-repo
          path: oss-licenses-plugin/build/repo/

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # ratchet:gradle/actions/setup-gradle@v6.1.0

      - name: Pre-create Android SDK cache directory
        run: mkdir -p "$ANDROID_USER_HOME/cache"

      - name: Build testapp (verify ${{ matrix.agp-version-key }})
        run: ./gradlew e2eTestTask --tests "com.google.android.gms.oss.licenses.plugin.EndToEndTest_${{ matrix.agp-version-key }}"
        working-directory: oss-licenses-plugin

  # Aggregate status for branch-protection: a single required check that passes
  # when every upstream job either succeeded or was legitimately skipped by path filtering.
  # Set this ("ci-success") as the required status check instead of the individual jobs
  # — skipped jobs don't post a status, so per-job required checks would block PRs that
  # only touch unrelated plugin directories.
  ci-success:
    needs:
      - lint-and-check
      - changes
      - build-strict-version-matcher
      - build-google-services
      - oss-licenses-build
      - oss-licenses-integration-test
      - oss-licenses-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "One or more upstream jobs failed or were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped."
